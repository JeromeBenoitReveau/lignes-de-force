# Graphe "qui soutient qui" — curé à la main, chaque arête sourcée.
# Mise à jour : `python update_network.py IR` propose des changements dans
# network.pending.yaml → tu relis → tu reportes ici. Rien n'est ajouté sans relecture.
#
# kind   : state | non_state | bloc | party | person | company | passage
# base   : pays d'ancrage (ISO2) — obligatoire pour non_state, party, person, company
# passage : détroit ou canal dont dépend le commerce mondial ; `coords` obligatoires, `riparian` = États riverains (ils le bordent,
#           ils ne le « détiennent » pas : un détroit international n'appartient pas à ses riverains)
# company : entreprise qui pèse sur un conflit par une ACTION documentée (service, arme, plateforme), jamais par sa seule taille
# member_of : blocs dont l'État est membre (ex. [EU]) — sert au « zoom » sur un bloc
# wikidata : identifiant Qxxx (personnes) — sert à récupérer la photo sur Wikimedia Commons
# leader : qui dirige l'acteur — {name, wikidata, role, sources} ou id d'un acteur « person » (ex. US: trump).
#          Affiché sur la fiche et dans les dossiers, PAS un nœud du graphe.
# person : réservé aux personnes qui ont au moins une relation sourcée PROPRE, distincte de l'institution qu'elles
#          dirigent (Musk ; Trump et Vance pour leurs soutiens personnels au RN, à l'AfD). Un chef d'armée ou d'État
#          qui n'agit qu'à travers son institution est un leader, pas un nœud.
# coords : [lat, lon] pour la carte, seulement si le pays d'ancrage ne suffit pas (ex. bloc)
# types  : arms | financial | training | troops | intelligence | political | economic | dual_use
# status : active | reduced | ended | alleged
# confidence : high (documenté officiellement) | medium (sources concordantes) | low (allégations)
# verified : date de ta dernière vérification — à revoir si > 6 mois
# why    : pourquoi l'acteur s'implique, en une phrase simple pour un néophyte — c'est une ANALYSE : elle doit
#          être couverte par une des sources de l'arête (think tank, ONU, presse de référence) et présentée comme telle
# since / until : AAAA ou AAAA-MM — plus ancienne date documentée par les sources citées (pas forcément le vrai début) et fin éventuelle

