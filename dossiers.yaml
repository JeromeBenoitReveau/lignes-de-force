  - id: iran
    title: La guerre entre Israël, les États-Unis et l'Iran
    card: "Frappes israélo-américaines en février 2026, riposte iranienne ; un cessez-le-feu fragile tient depuis avril."
    since: "2026-02"
    verified: 2026-09

    # Carte d'ouverture. Coordonnées des lieux : Wikidata (P625).
    map:
      bounds: [[12, 30], [42, 64]]
      anchors: [[32.08, 34.78], [35.689, 51.39]]   # Tel Aviv, Téhéran
      countries: [[IL, US], [IR]]   # les alliés de l'Iran ne sont pas l'État du pays où ils agissent : Liban, Yémen, Irak non colorés
      pins:
        - {label: Téhéran, at: [35.689, 51.39], text: "La capitale iranienne. Le Guide suprême Ali Khamenei a été tué lors des premières frappes, le 28 février 2026.",
           source: "Bibliothèque de la Chambre des communes, guerre et cessez-le-feu États-Unis–Iran en 2026 (juill. 2026) — https://commonslibrary.parliament.uk/research-briefings/cbp-10637/"}
        - {label: Fordo, at: [34.886, 50.997], text: "Site d'enrichissement d'uranium enterré, frappé par les États-Unis en juin 2025, avec ceux de Natanz et d'Ispahan.",
           source: "Council on Foreign Relations, Global Conflict Tracker : le conflit avec l'Iran (sept. 2026) — https://www.cfr.org/global-conflict-tracker/conflict/confrontation-between-united-states-and-iran", dir: left}
        - {label: Détroit d'Ormuz, at: [26.6, 56.5], text: "L'Iran l'a fermé pendant la guerre, provoquant un choc énergétique mondial ; sa réouverture est au cœur des négociations.",
           source: "Council on Foreign Relations, Global Conflict Tracker : le conflit avec l'Iran (sept. 2026) — https://www.cfr.org/global-conflict-tracker/conflict/confrontation-between-united-states-and-iran"}
        - {label: Beyrouth, at: [33.887, 35.513], text: "Capitale du Liban. Le Hezbollah y est entré en guerre contre Israël en mars 2026 ; au moins 3 696 morts au Liban au 10 juin, selon le ministère libanais de la Santé.",
           source: "Al Jazeera, bilan des attaques américano-israéliennes contre l'Iran (juin 2026) — https://www.aljazeera.com/news/2026/3/1/us-israel-attacks-on-iran-death-toll-and-injuries-live-tracker", dir: left}
        - {label: Sanaa, at: [15.35, 44.2], text: "Capitale tenue par les Houthis, qui ont tiré des missiles sur Israël et menacent la navigation en mer Rouge.",
           source: "FDD's Long War Journal, les Houthis attaquent Israël et annoncent un blocus des navires israéliens (juin 2026) — https://www.longwarjournal.org/archives/2026/06/houthis-attack-israel-and-announce-ban-on-israeli-vessels-in-the-red-sea.php"}
    lede: >-
      Le 28 février 2026, Israël et les États-Unis ont lancé une guerre aérienne contre l'Iran, visant ses programmes
      nucléaire et de missiles ; le Guide suprême Ali Khamenei a été tué. L'Iran a riposté contre Israël et les bases
      américaines du Golfe, et fermé le détroit d'Ormuz. Un cessez-le-feu fragile tient depuis avril ; les négociations
      continuent, sans accord.
    lede_sources:
      - "Bibliothèque de la Chambre des communes, guerre et cessez-le-feu États-Unis–Iran en 2026 (juill. 2026) — https://commonslibrary.parliament.uk/research-briefings/cbp-10637/"
      - "Council on Foreign Relations, Global Conflict Tracker : le conflit avec l'Iran (sept. 2026) — https://www.cfr.org/global-conflict-tracker/conflict/confrontation-between-united-states-and-iran"

    origins:
      text: >-
        Depuis la révolution islamique de 1979, l'Iran et les États-Unis sont adversaires. Le programme nucléaire iranien
        est au cœur du conflit : l'accord de 2015 limitait l'enrichissement d'uranium en échange d'une levée des
        sanctions, mais Donald Trump en est sorti en 2018. En juin 2025, Israël puis les États-Unis frappent des sites
        nucléaires iraniens. Fin 2025, l'effondrement économique déclenche des manifestations, réprimées au prix de plus
        de 6 000 morts selon le CFR.
      sources:
        - "Council on Foreign Relations, « International Sanctions on Iran » — https://www.cfr.org/backgrounder/international-sanctions-iran"
        - "Council on Foreign Relations, Global Conflict Tracker : le conflit avec l'Iran (sept. 2026) — https://www.cfr.org/global-conflict-tracker/conflict/confrontation-between-united-states-and-iran"

    sides:
      - name: Israël et les États-Unis
        actors: [IL, US]
        text: >-
          Ils mènent ensemble les frappes contre l'Iran depuis le 28 février 2026, avec pour cibles affichées ses
          programmes nucléaire et de missiles. Israël combat aussi le Hezbollah au Liban.
        sources:
          - "Bibliothèque de la Chambre des communes (juill. 2026) — https://commonslibrary.parliament.uk/research-briefings/cbp-10637/"
      - name: L'Iran et ses alliés
        actors: [IR, hezbollah, houthis, kataib_hezbollah]
        text: >-
          L'Iran est désormais dirigé par Mojtaba Khamenei, fils de l'ancien Guide suprême. Autour de lui, l'« axe de la
          résistance » : le Hezbollah libanais, les Houthis du Yémen et des milices irakiennes, que Téhéran arme et finance.
        sources:
          - "Council on Foreign Relations, Global Conflict Tracker : le conflit avec l'Iran (sept. 2026) — https://www.cfr.org/global-conflict-tracker/conflict/confrontation-between-united-states-and-iran"
          - "Council on Foreign Relations, « What Is Hamas? » (oct. 2025) — https://www.cfr.org/backgrounders/what-hamas"

    stakes:
      - label: La bombe nucléaire
        icon: gem
        text: >-
          Empêcher l'Iran d'avoir l'arme nucléaire est l'objectif affiché de Washington. Le sort de l'uranium enrichi
          iranien divise les négociateurs.
        sources:
          - "Bibliothèque de la Chambre des communes (juill. 2026) — https://commonslibrary.parliament.uk/research-briefings/cbp-10637/"
      - label: Le pétrole et le détroit d'Ormuz
        icon: waves
        text: >-
          En fermant le détroit d'Ormuz, l'Iran a provoqué un choc énergétique mondial. Sa réouverture progressive est sa
          principale carte dans les négociations.
        sources:
          - "Council on Foreign Relations, Global Conflict Tracker : le conflit avec l'Iran (sept. 2026) — https://www.cfr.org/global-conflict-tracker/conflict/confrontation-between-united-states-and-iran"
          - "Times of Israel, l'Iran attend la réponse américaine à sa proposition sur Ormuz (sept. 2026) — https://timesofisrael.com/liveblog-september-26-2026"
      - label: L'avenir du régime iranien
        icon: anchor
        text: >-
          La mort d'Ali Khamenei, les frappes et l'effondrement économique fragilisent la République islamique, déjà
          contestée par les manifestations de fin 2025.
        sources:
          - "Council on Foreign Relations, Global Conflict Tracker : le conflit avec l'Iran (sept. 2026) — https://www.cfr.org/global-conflict-tracker/conflict/confrontation-between-united-states-and-iran"
      - label: Le Liban et le Hezbollah
        icon: route
        text: >-
          Un accord de juin 2026 lie le retrait israélien du Sud-Liban au désarmement du Hezbollah, qui le rejette.
        sources:
          - "Al Jazeera, l'accord Israël–Liban lie cessez-le-feu et désarmement du Hezbollah (juin 2026) — https://www.aljazeera.com/features/2026/6/27/israel-lebanon-deal-ties-ceasefire-to-hezbollah-disarmament-will-it-work"
      - label: Une aubaine pour la Russie
        icon: wheat
        text: >-
          La flambée du pétrole renfloue le budget russe et donc sa guerre en Ukraine, selon Timothy Ash (Chatham House).
        sources:
          - "Chatham House, Timothy Ash (avr. 2026) — https://www.chathamhouse.org/2026/04/iran-war-has-been-economic-gift-putin"

    toll:
      text: >-
        Selon le ministère iranien de la Santé, les frappes ont tué au moins 3 468 personnes en Iran entre le 28 février et
        le 10 juin 2026 ; l'ONG iranienne de défense des droits humains HRANA recense 1 701 civils tués. Au Liban, 3 696
        personnes ont été tuées selon le ministère libanais de la Santé ; en Israël, au moins 26. Treize militaires
        américains sont morts au combat. Jusqu'à 3,2 millions d'Iraniens ont dû quitter leur foyer, au moins temporairement.
      sources:
        - "Al Jazeera, bilan des attaques américano-israéliennes contre l'Iran (juin 2026) — https://www.aljazeera.com/news/2026/3/1/us-israel-attacks-on-iran-death-toll-and-injuries-live-tracker"
        - "Council on Foreign Relations, Global Conflict Tracker : le conflit avec l'Iran (sept. 2026) — https://www.cfr.org/global-conflict-tracker/conflict/confrontation-between-united-states-and-iran"

    history:
      text: >-
        On compare souvent cette guerre à l'invasion de l'Irak en 2003, ou au renversement du Premier ministre iranien
        Mossadegh, organisé par la CIA en 1953. Pour Randall Fowler (Abilene Christian University), ces deux analogies
        trompent : 1953 était une opération secrète de la guerre froide, et en 2003 les États-Unis avaient envahi le pays
        au sol. Il juge plus éclairante la guerre Iran-Irak des années 1980, quand Washington a accru la pression navale
        jusqu'à ce que Téhéran accepte un cessez-le-feu. C'est une lecture parmi d'autres, et toute analogie a ses limites.
      sources:
        - "Randall Fowler, « Iran in 2026 Is Neither Iran in 1953 nor Iraq in 2003 », Providence (févr. 2026) — https://providencemag.com/2026/02/iran-in-2026-is-neither-iran-in-1953-nor-iraq-in-2003/"

    now:
      text: >-
        Le cessez-le-feu conclu le 8 avril sous médiation pakistanaise a été violé à plusieurs reprises ; un protocole
        d'accord signé en juin a ouvert 60 jours de négociations. Fin septembre 2026, les frappes ont cessé depuis plusieurs
        semaines, mais le détroit d'Ormuz n'est pas rouvert. Le 26 septembre, Donald Trump a rejeté une proposition
        iranienne tout en poursuivant les discussions, menées par l'intermédiaire du Qatar.
      sources:
        - "Bibliothèque de la Chambre des communes (juill. 2026) — https://commonslibrary.parliament.uk/research-briefings/cbp-10637/"
        - "Council on Foreign Relations, Global Conflict Tracker : le conflit avec l'Iran (sept. 2026) — https://www.cfr.org/global-conflict-tracker/conflict/confrontation-between-united-states-and-iran"
        - "GlobalSecurity.org, guerre en Iran, point du 30 septembre 2026 — https://www.globalsecurity.org/military/ops/iran-war-oprep.htm"

