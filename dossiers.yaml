        source: "CBS News, Elon Musk dit avoir refusé une demande ukrainienne pour ne pas être complice d'un acte de guerre majeur (sept. 2023) — https://www.cbsnews.com/news/elon-musk-ukraine-russia-war-starlink-satellite-denied-major-act-of-war/"
