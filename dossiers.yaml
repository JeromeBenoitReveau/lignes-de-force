# Dossiers — une page par conflit ou tension, écrite pour quelqu'un qui n'y connaît rien. Curé à la main.
# Les acteurs et les soutiens viennent de network.yaml (source de vérité) : ici, seulement le récit.
# Chaque paragraphe cite ses sources ; une interprétation (« pourquoi ») est attribuée à qui la formule.
#
# id        : nom de la page (site/<id>.html)
# card      : résumé court de la carte d'accueil, écrit pour tenir en entier (≤ 130 caractères), tiré du texte du dossier
# sides     : les camps ; actors = ids de network.yaml. Soutiens ET dirigeant (champ leader) lus dans le graphe.
# people    : « Les personnes qui comptent » : [{who: id du registre people (fin du fichier), role, text, sources}] ;
#             les dirigeants des camps et les médiations (network.yaml) s'y ajoutent d'eux-mêmes
# map       : carte d'ouverture ; sans « regions », les pays de chaque camp sont colorés (map.countries pour les préciser)
# stakes    : les enjeux concrets ; timeline : dates AAAA ou AAAA-MM
# council   : « Au Conseil de sécurité » : vetos et résolutions adoptées [{date, text, source}] (facultatif)
# history   : parallèles historiques ET leurs limites, attribués à des historiens (facultatif)
# (vocabulaire : glossaire.yaml, commun à tout le site ; les termes y sont expliqués au survol partout)

dossiers:
  - id: soudan
    title: La guerre au Soudan
    card: "Depuis 2023, deux anciens alliés se disputent le pays ; près de 14 millions de personnes ont fui."
    since: "2023-04"
    verified: 2026-09

    # Carte d'ouverture. Coordonnées des villes : Wikidata (P625). Contours des États : geoBoundaries / OCHA (CC BY 3.0 IGO).
    map:
      bounds: [[-3, 12], [40, 58]]
      regions:
        file: sdn_adm1
        credit: limites des États geoBoundaries / OCHA (CC BY 3.0 IGO)
        sides:
          - [Khartoum, Northern, River Nile, Red Sea, Kassala, Gedaref, Gezira, Sennar, White Nile]
          - [North Darfur, South Darfur, West Darfur, Central Darfur, East Darfur]
        contested: [North Kordofan, South Kordofan, West Kordofan, Blue Nile]
        note: >-
          Contrôle approximatif, État par État : l'armée tient Khartoum, la vallée du Nil et l'est ; les FSR, l'essentiel
          du Darfour ; le Kordofan est la principale ligne de front, et les combats ont gagné le Nil Bleu à l'été 2026.
          Les lignes de front réelles ne suivent pas les limites administratives.
        sources:
          - "International Crisis Group, « Divided Sudan, Elusive Peace » (avr. 2026) — https://www.crisisgroup.org/brf/africa/sudan-egypt-saudi-arabia-united-arab-emirates-united-states/b211-divided-sudan-elusive-peace"
          - "Security Council Report, prévisions de septembre 2026 — https://www.securitycouncilreport.org/monthly-forecast/2026-09/sudan-41.php"
      anchors: [[19.616, 37.216], [12.05, 24.883]]   # Port-Soudan (gouvernement de l'armée), Nyala (gouvernement des FSR)
      pins:
        - {label: Port-Soudan, at: [19.616, 37.216], text: "Siège du gouvernement de l'armée, sur la mer Rouge.",
           source: "International Crisis Group, « Divided Sudan, Elusive Peace » (avr. 2026) — https://www.crisisgroup.org/brf/africa/sudan-egypt-saudi-arabia-united-arab-emirates-united-states/b211-divided-sudan-elusive-peace"}
        - {label: Khartoum, at: [15.603, 32.527], text: "La capitale, au confluent des deux Nils, reprise par l'armée en mars 2025.",
           source: "Middle East Eye (mars 2025) — https://www.middleeasteye.net/news/sudan-army-retake-control-presidential-palace-rsf"}
        - {label: Nyala, at: [12.05, 24.883], text: "Siège du gouvernement parallèle des FSR depuis août 2025.",
           source: "International Crisis Group, « Divided Sudan, Elusive Peace » (avr. 2026) — https://www.crisisgroup.org/brf/africa/sudan-egypt-saudi-arabia-united-arab-emirates-united-states/b211-divided-sudan-elusive-peace"}
        - {label: El-Fasher, at: [13.627, 25.35], dir: left, text: "Prise par les FSR en octobre 2025 après 18 mois de siège ; l'ONU y relève les « marques d'un génocide ».",
           source: "ONU Info (févr. 2026) — https://news.un.org/en/story/2026/02/1166997"}
        - {label: El-Obeid, at: [13.183, 30.217], text: "Grande ville du Kordofan visée par les drones des FSR en 2026.",
           source: "Security Council Report (sept. 2026) — https://www.securitycouncilreport.org/monthly-forecast/2026-09/sudan-41.php"}
      routes:
        - {label: "Transit par le Tchad", from: [12.11, 15.05], to: 1,
           text: "Selon les enquêteurs de l'ONU, armes, mercenaires et matériel arrivent aux FSR via le Tchad (tracé schématique).",
           source: "ONU Info (sept. 2026) — https://news.un.org/en/story/2026/09/1168270"}
        - {label: "Transit par le sud-est de la Libye", from: [24, 23], to: 1,
           text: "Autre point de transit cité par l'ONU vers les FSR (tracé schématique).",
           source: "ONU Info (sept. 2026) — https://news.un.org/en/story/2026/09/1168270"}
        - {label: "Transit par Bosaso (Somalie)", from: [11.283, 49.183], to: 1,
           text: "Port somalien cité par l'ONU comme point de transit vers les FSR (tracé schématique).",
           source: "ONU Info (sept. 2026) — https://news.un.org/en/story/2026/09/1168270"}
      flows:
        - {label: "L'or vers les Émirats", from: [15.603, 32.527], to_actor: AE,
           text: "La plus grande partie de l'or soudanais, première source d'argent des deux camps, finit aux Émirats.",
           source: "Chatham House, « Gold and the war in Sudan » (mars 2025, mis à jour mars 2026) — https://www.chathamhouse.org/2025/03/gold-and-war-sudan"}
    lede: >-
      Depuis avril 2023, l'armée soudanaise et les Forces de soutien rapide, deux anciens alliés qui avaient pris
      le pouvoir ensemble, se font la guerre pour le contrôle du pays. Des puissances étrangères arment chacun des
      deux camps, attirées par l'or, la mer Rouge et le Nil. Près de 14 millions de personnes ont dû fuir leur foyer.
    lede_sources:
      - "Council on Foreign Relations, Global Conflict Tracker : la guerre civile au Soudan — https://www.cfr.org/global-conflict-tracker/conflict/power-struggle-sudan"
      - "Al Jazeera, selon le HCR environ 14 millions de personnes chassées de chez elles (janv. 2026) — https://www.aljazeera.com/news/2026/1/28/sudans-war-displaced-crisis-peaks-as-millions-eye-return-to-ruined-homes"

    origins:
      text: >-
        En 2019, un soulèvement populaire fait tomber le dictateur Omar el-Béchir. Militaires et civils doivent partager
        le pouvoir, mais en 2021 le chef de l'armée, Abdel Fattah al-Burhan, et le chef des FSR, Mohamed Hamdan Dagalo
        dit « Hemedti », écartent ensemble le gouvernement civil. Un accord de décembre 2022 prévoit d'intégrer les FSR
        dans l'armée : les deux généraux ne s'entendent ni sur le calendrier ni sur qui commandera. Le 15 avril 2023,
        les combats éclatent à Khartoum.
      sources:
        - "Council on Foreign Relations, Global Conflict Tracker : la guerre civile au Soudan — https://www.cfr.org/global-conflict-tracker/conflict/power-struggle-sudan"

    sides:
      - name: L'armée soudanaise
        actors: [SD]
        text: >-
          Dirigée par le général al-Burhan. Elle tient la capitale Khartoum, la vallée du Nil et l'est du pays,
          dont Port-Soudan, sur la mer Rouge, où siège son gouvernement.
        sources:
          - "International Crisis Group, « Divided Sudan, Elusive Peace » (avr. 2026) — https://www.crisisgroup.org/brf/africa/sudan-egypt-saudi-arabia-united-arab-emirates-united-states/b211-divided-sudan-elusive-peace"
      - name: Les Forces de soutien rapide (FSR)
        actors: [rsf]
        text: >-
          Groupe paramilitaire dirigé par Hemedti. Il tient l'essentiel du Darfour, à l'ouest, ravitaillé par le Tchad
          et la Libye. En août 2025, il a formé un gouvernement parallèle à Nyala, qu'aucun État ne reconnaît.
        sources:
          - "International Crisis Group, « Divided Sudan, Elusive Peace » (avr. 2026) — https://www.crisisgroup.org/brf/africa/sudan-egypt-saudi-arabia-united-arab-emirates-united-states/b211-divided-sudan-elusive-peace"

    stakes:
      - label: L'or
        icon: gem
        text: >-
          C'est la première source d'argent des deux camps. La plus grande partie de l'or soudanais finit aux Émirats
          arabes unis, par où les deux camps font aussi transiter leurs paiements.
        sources:
          - "Chatham House, « Gold and the war in Sudan » (mars 2025, mis à jour mars 2026) — https://www.chathamhouse.org/2025/03/gold-and-war-sudan"
      - label: La mer Rouge
        icon: anchor
        text: >-
          Le Soudan a une façade sur la mer Rouge, l'une des grandes routes du commerce mondial. Les Émirats y
          projettent un port de 6 milliards de dollars ; la Turquie et l'Arabie saoudite y défendent aussi leur
          influence.
        sources:
          - "Middle East Eye, les FSR, alliées clés des intérêts logistiques et commerciaux émiriens (sept. 2024) — https://www.middleeasteye.net/news/sudan-rsf-key-ally-uae-logistical-and-corporate-interests"
          - "International Crisis Group, « Divided Sudan, Elusive Peace » (avr. 2026) — https://www.crisisgroup.org/brf/africa/sudan-egypt-saudi-arabia-united-arab-emirates-united-states/b211-divided-sudan-elusive-peace"
      - label: Le Nil
        icon: waves
        text: >-
          L'Égypte, en aval du fleuve, veut garder la main sur ses intérêts dans le bassin du Nil et un voisin stable
          au sud : elle soutient l'armée. L'Éthiopie, sa rivale régionale, penche de plus en plus vers les FSR.
        sources:
          - "International Crisis Group, « Divided Sudan, Elusive Peace » (avr. 2026) — https://www.crisisgroup.org/brf/africa/sudan-egypt-saudi-arabia-united-arab-emirates-united-states/b211-divided-sudan-elusive-peace"
      - label: Les terres agricoles
        icon: wheat
        text: >-
          Deux groupes émiriens exploitent ensemble plus de 200 000 hectares de terres au Soudan (50 000 et 162 000,
          selon Middle East Eye), pour la sécurité alimentaire des Émirats.
        sources:
          - "Middle East Eye, les FSR, alliées clés des intérêts logistiques et commerciaux émiriens (sept. 2024) — https://www.middleeasteye.net/news/sudan-rsf-key-ally-uae-logistical-and-corporate-interests"
      - label: Les routes d'approvisionnement
        icon: route
        text: >-
          Selon les enquêteurs de l'ONU, armes, mercenaires (dont des ex-militaires colombiens) et matériel arrivent
          aux FSR par le Tchad, le sud-est de la Libye et le port somalien de Bosaso.
        sources:
          - "ONU Info, des réseaux extérieurs alimentent la guerre au Soudan (sept. 2026) — https://news.un.org/en/story/2026/09/1168270"

    toll:
      text: >-
        Environ 14 millions de personnes ont dû fuir leur foyer. En octobre 2025, après 18 mois de siège, les FSR ont
        pris la ville d'El-Fasher, au Darfour : les enquêteurs de l'ONU y ont relevé les « marques d'un génocide »
        contre les communautés zaghawa et four.
      sources:
        - "Al Jazeera, selon le HCR environ 14 millions de personnes chassées de chez elles (janv. 2026) — https://www.aljazeera.com/news/2026/1/28/sudans-war-displaced-crisis-peaks-as-millions-eye-return-to-ruined-homes"
        - "ONU Info, les « marques d'un génocide » à El-Fasher (févr. 2026) — https://news.un.org/en/story/2026/02/1166997"

    now:
      text: >-
        Le pays glisse vers une partition de fait : chaque camp a proclamé son propre gouvernement. Depuis l'été 2026,
        l'armée mène une offensive au Kordofan, au centre, et les FSR frappent des villes avec des drones kamikazes,
        notamment El-Obeid. Le plan de paix du « Quad » (trêve de trois mois, puis cessez-le-feu et transition
        civile) est enlisé : l'armée l'a rejeté, et ses parrains ne s'accordent pas entre eux.
      sources:
        - "Security Council Report, prévisions de septembre 2026 — https://www.securitycouncilreport.org/monthly-forecast/2026-09/sudan-41.php"
        - "International Crisis Group, « Divided Sudan, Elusive Peace » (avr. 2026) — https://www.crisisgroup.org/brf/africa/sudan-egypt-saudi-arabia-united-arab-emirates-united-states/b211-divided-sudan-elusive-peace"

    # Au Conseil de sécurité de l'ONU : vetos et résolutions adoptées sur ce conflit
    council:
      - date: "2024-11"
        text: "Veto de la Russie contre un texte exigeant l'arrêt des attaques contre les civils et un cessez-le-feu ; 14 voix pour sur 15"
        source: "Security Council Report, Soudan : vote sur un projet de résolution, avec le résultat du vote (nov. 2024) — https://www.securitycouncilreport.org/whatsinblue/2024/11/103323.php"

    timeline:
      - date: "2019"
        text: Chute d'Omar el-Béchir après un soulèvement populaire
        source: "Council on Foreign Relations, Global Conflict Tracker — https://www.cfr.org/global-conflict-tracker/conflict/power-struggle-sudan"
      - date: "2021"
        text: Burhan et Hemedti renversent ensemble le gouvernement civil
        source: "Council on Foreign Relations, Global Conflict Tracker — https://www.cfr.org/global-conflict-tracker/conflict/power-struggle-sudan"
      - date: "2023-04"
        text: Début de la guerre à Khartoum
        source: "Council on Foreign Relations, Global Conflict Tracker — https://www.cfr.org/global-conflict-tracker/conflict/power-struggle-sudan"
      - date: "2025-03"
        text: L'armée reprend le palais présidentiel et Khartoum
        source: "Middle East Eye, l'armée reprend le palais présidentiel (mars 2025) — https://www.middleeasteye.net/news/sudan-army-retake-control-presidential-palace-rsf"
      - date: "2025-08"
        text: Les FSR forment un gouvernement parallèle à Nyala
        source: "International Crisis Group (avr. 2026) — https://www.crisisgroup.org/brf/africa/sudan-egypt-saudi-arabia-united-arab-emirates-united-states/b211-divided-sudan-elusive-peace"
      - date: "2025-09"
        text: Plan de paix du Quad (États-Unis, Arabie saoudite, Émirats, Égypte)
        source: "International Crisis Group (avr. 2026) — https://www.crisisgroup.org/brf/africa/sudan-egypt-saudi-arabia-united-arab-emirates-united-states/b211-divided-sudan-elusive-peace"
      - date: "2025-10"
        text: Chute d'El-Fasher, massacres qualifiés de « marques d'un génocide » par l'ONU
        source: "ONU Info (févr. 2026) — https://news.un.org/en/story/2026/02/1166997"
      - date: "2026-07"
        text: Offensive de l'armée au Kordofan ; drones des FSR sur les villes
        source: "Security Council Report (sept. 2026) — https://www.securitycouncilreport.org/monthly-forecast/2026-09/sudan-41.php"
      - date: "2026-09"
        text: L'ONU documente les réseaux étrangers qui arment les FSR
        source: "ONU Info (sept. 2026) — https://news.un.org/en/story/2026/09/1168270"


  - id: ukraine
    title: La guerre en Ukraine
    card: "Depuis 2022, la Russie envahit son voisin et occupe environ 20 % de son territoire."
    since: "2022-02"
    verified: 2026-09

    # Carte d'ouverture. Coordonnées des villes : Wikidata (P625). Contours des oblasts : geoBoundaries / OpenStreetMap (ODbL).
    map:
      bounds: [[41, 2], [59, 48]]
      regions:
        file: ukr_adm1
        credit: limites des oblasts geoBoundaries / © contributeurs OpenStreetMap (ODbL)
        sides:
          - [Cherkasy Oblast, Chernihiv Oblast, Chernivtsi Oblast, Dnipropetrovsk Oblast, Ivano-Frankivsk Oblast, Kharkiv Oblast, Khmelnytskyi Oblast, Kirovohrad Oblast, Kyiv, Kyiv Oblast, Lviv Oblast, Mykolaiv Oblast, Odessa Oblast, Poltava Oblast, Rivne Oblast, Sumy Oblast, Ternopil Oblast, Vinnytsia Oblast, Volyn Oblast, Zakarpattia Oblast, Zhytomyr Oblast]
          - [Autonomous Republic of Crimea, Sevastopol, Luhansk Oblast, Donetsk Oblast]
        contested: [Zaporizhia Oblast, Kherson Oblast]
        contested_label: Occupé en partie / ligne de front
        note: >-
          Contrôle approximatif, oblast par oblast : la Russie occupe la Crimée depuis 2014, toute la région de Louhansk et
          environ 81 % de celle de Donetsk ; elle tient une large partie des régions de Zaporijia et de Kherson. Les petites
          incursions dans d'autres régions n'apparaissent pas à cette échelle.
        sources:
          - "Council on Foreign Relations, Global Conflict Tracker : la guerre en Ukraine (sept. 2026) — https://www.cfr.org/global-conflict-tracker/conflict/conflict-ukraine"
          - "Freedom House, « Russian-occupied territories of Ukraine », Freedom in the World 2026 — https://freedomhouse.org/country/russian-occupied-territories-ukraine/freedom-world/2026"
      anchors: [[50.45, 30.524], [55.751, 37.617]]   # Kyiv, Moscou
      pins:
        - {label: Kyiv, at: [50.45, 30.524], text: "La capitale ukrainienne. En septembre 2026, les deux camps s'engagent à ne pas frapper les capitales pendant trois jours.",
           source: "Al Jazeera (sept. 2026) — https://www.aljazeera.com/news/2026/9/5/russias-putin-meets-us-envoys-to-discuss-trump-proposal-to-end-ukraine-war"}
        - {label: Moscou, at: [55.751, 37.617], text: "Le pouvoir russe y a reçu les émissaires américains le 5 septembre 2026, sans rien céder sur ses exigences territoriales.",
           source: "Al Jazeera (sept. 2026) — https://www.aljazeera.com/news/2026/9/5/russias-putin-meets-us-envoys-to-discuss-trump-proposal-to-end-ukraine-war"}
        - {label: Crimée, at: [44.948, 34.1], text: "Péninsule dont la Russie s'est emparée et qu'elle a annexée en 2014.",
           source: "Council on Foreign Relations, Global Conflict Tracker : la guerre en Ukraine (sept. 2026) — https://www.cfr.org/global-conflict-tracker/conflict/conflict-ukraine"}
        - {label: Donetsk, at: [48.016, 37.803], text: "L'Ukraine ne tient plus qu'environ 19 % de cette région, principal enjeu territorial des négociations.",
           source: "Council on Foreign Relations, Global Conflict Tracker : la guerre en Ukraine (sept. 2026) — https://www.cfr.org/global-conflict-tracker/conflict/conflict-ukraine"}
        - {label: Zaporijia, at: [47.85, 35.117], text: "Région où l'Ukraine a repris environ 260 km² en février 2026, son premier gain mensuel depuis 2023.",
           source: "Council on Foreign Relations, Global Conflict Tracker : la guerre en Ukraine (sept. 2026) — https://www.cfr.org/global-conflict-tracker/conflict/conflict-ukraine", dir: left}
    lede: >-
      Depuis février 2022, la Russie mène une invasion à grande échelle de l'Ukraine, son voisin. Elle occupe environ
      20 % du territoire ukrainien. L'Europe et, de moins en moins, les États-Unis soutiennent Kyiv ; la Corée du Nord,
      la Chine et l'Iran aident Moscou. Des négociations sont en cours, sans avancée à ce jour.
    lede_sources:
      - "Council on Foreign Relations, Global Conflict Tracker : la guerre en Ukraine (sept. 2026) — https://www.cfr.org/global-conflict-tracker/conflict/conflict-ukraine"
      - "Bibliothèque de la Chambre des communes, « Ukraine : a new push for peace » (sept. 2026) — https://commonslibrary.parliament.uk/research-briefings/cbp-12198/"

    origins:
      text: >-
        En 2014, après l'arrivée au pouvoir d'un gouvernement pro-occidental à Kyiv, des forces spéciales russes s'emparent
        de la Crimée, et des séparatistes prorusses proclament l'indépendance de deux régions de l'est, le Donbass : une
        guerre de basse intensité s'y installe. Le 24 février 2022, Vladimir Poutine lance une invasion par terre, mer et
        air, en affirmant vouloir « démilitariser et dénazifier » l'Ukraine.
      sources:
        - "Council on Foreign Relations, Global Conflict Tracker : la guerre en Ukraine (sept. 2026) — https://www.cfr.org/global-conflict-tracker/conflict/conflict-ukraine"

    sides:
      - name: L'Ukraine
        actors: [UA]
        text: >-
          Dirigée par le président Volodymyr Zelensky. Elle tient environ 80 % de son territoire, dont une petite partie
          de la région de Donetsk, sur un front d'environ 1 200 km largement figé.
        sources:
          - "Council on Foreign Relations, Global Conflict Tracker : la guerre en Ukraine (sept. 2026) — https://www.cfr.org/global-conflict-tracker/conflict/conflict-ukraine"
      - name: La Russie
        actors: [RU]
        text: >-
          Dirigée par Vladimir Poutine. Elle contrôle toute la région de Louhansk et la plus grande partie de celle de
          Donetsk, et exige que l'Ukraine lui cède le reste de l'est du pays.
        sources:
          - "Council on Foreign Relations, Global Conflict Tracker : la guerre en Ukraine (sept. 2026) — https://www.cfr.org/global-conflict-tracker/conflict/conflict-ukraine"
          - "Al Jazeera, Poutine reçoit les émissaires américains (sept. 2026) — https://www.aljazeera.com/news/2026/9/5/russias-putin-meets-us-envoys-to-discuss-trump-proposal-to-end-ukraine-war"

    stakes:
      - label: Le territoire
        icon: route
        text: >-
          La Russie occupe environ un cinquième de l'Ukraine. La question de savoir si Kyiv doit céder des territoires
          pour obtenir la paix bloque toutes les négociations.
        sources:
          - "Council on Foreign Relations, Global Conflict Tracker : la guerre en Ukraine (sept. 2026) — https://www.cfr.org/global-conflict-tracker/conflict/conflict-ukraine"
          - "Bibliothèque de la Chambre des communes (sept. 2026) — https://commonslibrary.parliament.uk/research-briefings/cbp-12198/"
      - label: La sécurité de l'Europe
        icon: anchor
        text: >-
          Pour l'Union européenne, l'agression russe est un « défi existentiel » : si l'Ukraine tombe, c'est tout le
          continent qui devient plus exposé.
        sources:
          - "Carnegie Europe, Erik Jones (janv. 2026) — https://carnegieendowment.org/europe/strategic-europe/2026/01/solidarity-is-a-must-for-europe-to-ensure-its-own-security"
      - label: L'OTAN
        icon: gem
        text: >-
          Moscou présente la guerre comme une réponse à l'OTAN. Le plan de paix américain interdirait à l'Ukraine d'y
          adhérer, ce qui pose la question des garanties de sécurité qu'on lui offrirait à la place.
        sources:
          - "Council on Foreign Relations, Global Conflict Tracker : la guerre en Ukraine (sept. 2026) — https://www.cfr.org/global-conflict-tracker/conflict/conflict-ukraine"
          - "Bibliothèque de la Chambre des communes (sept. 2026) — https://commonslibrary.parliament.uk/research-briefings/cbp-12198/"
      - label: Le duel Chine–États-Unis
        icon: waves
        text: >-
          Selon une commission du Congrès américain, Pékin ne peut pas accepter une défaite russe, qui permettrait à
          Washington de se concentrer entièrement sur la Chine. La guerre en Ukraine se joue aussi dans cette rivalité.
        sources:
          - "Commission du Congrès américain sur la Chine (USCC), fiche Chine-Russie (août 2026) — https://www.uscc.gov/research/china-russia-fact-sheet-short-primer-relationship"
      - label: Les communications par satellite
        icon: route
        text: >-
          L'armée ukrainienne dépend de Starlink, le réseau de satellites de l'entreprise américaine SpaceX, pour ses
          communications et ses drones. Une entreprise privée décide donc où le service fonctionne : en 2022, Elon Musk
          a refusé de l'étendre jusqu'à la Crimée. Depuis février 2026, seuls les terminaux enregistrés fonctionnent en
          Ukraine, ce qui coupe ceux que l'armée russe utilisait sans autorisation.
        sources:
          - "CBS News, Elon Musk dit avoir refusé une demande ukrainienne pour ne pas être complice d'un acte de guerre majeur (sept. 2023) — https://www.cbsnews.com/news/elon-musk-ukraine-russia-war-starlink-satellite-denied-major-act-of-war/"
          - "Euronews, SpaceX et le ministère ukrainien de la Défense bloquent l'usage russe de Starlink (févr. 2026) — https://euronews.com/2026/02/02/musks-spacex-and-ukraines-defence-ministry-to-block-russias-use-of-starlink"

    toll:
      text: >-
        Selon les estimations du CSIS, un centre de recherche américain, les pertes militaires cumulées (tués, blessés et
        disparus) des deux camps dépassent 2 millions de personnes entre février 2022 et juin 2026, dont 400 000 à 450 000
        soldats russes et 125 000 à 150 000 soldats ukrainiens tués.
      sources:
        - "CSIS, « Russian Blood and Treasure » (juill. 2026) — https://www.csis.org/analysis/russian-blood-and-treasure-ballooning-costs-putins-war"

    history:
      text: >-
        On compare souvent cette guerre à Munich, en 1938, quand la France et le Royaume-Uni laissèrent Hitler prendre une
        partie de la Tchécoslovaquie : céder des territoires à la Russie encouragerait de nouvelles agressions. D'autres
        invoquent 1914, où l'escalade entre puissances mena à une guerre mondiale. Des historiens mettent en garde : ces
        analogies sont des raccourcis qui déforment autant qu'ils éclairent (l'Allemagne de 1938 n'avait pas l'arme
        nucléaire). Chaque pays lit aussi la guerre à travers ses propres blessures : la Pologne pense à 1939, la
        République tchèque à l'invasion soviétique de 1968, l'Allemagne à son passé nazi.
      sources:
        - "Christopher LaRoche, « Ukraine Isn't Munich—or Vietnam or Berlin », Foreign Policy, repris par History News Network (oct. 2022) — https://www.historynewsnetwork.org/article/ukraine-isnt-munich-berlin-or-vietnam-the-limits-a"
        - "Kalhousová, Finkel et Kocián, « Historical analogies, traumatic past and responses to the war in Ukraine », International Affairs (nov. 2024) — https://academic.oup.com/ia/article/100/6/2501/7824588"
        - "ASPI The Strategist, les limites de la décision politique par analogie — https://www.aspistrategist.org.au/another-munich-crisis-understanding-the-limits-of-policymaking-by-analogy/"

    now:
      text: >-
        Le front est largement figé ; en février 2026, l'Ukraine a regagné du terrain pour la première fois depuis 2023.
        Début septembre 2026, deux émissaires de Donald Trump ont rencontré Vladimir Poutine à Moscou puis Volodymyr
        Zelensky à Kyiv, avec une trêve de trois jours sur les frappes visant les deux capitales. La Russie ne renonce à
        aucune de ses exigences territoriales ; des pourparlers aux Émirats sont envisagés pour octobre, sans date fixée.
      sources:
        - "Council on Foreign Relations, Global Conflict Tracker : la guerre en Ukraine (sept. 2026) — https://www.cfr.org/global-conflict-tracker/conflict/conflict-ukraine"
        - "Al Jazeera (sept. 2026) — https://www.aljazeera.com/news/2026/9/5/russias-putin-meets-us-envoys-to-discuss-trump-proposal-to-end-ukraine-war"
        - "Bibliothèque de la Chambre des communes (sept. 2026) — https://commonslibrary.parliament.uk/research-briefings/cbp-12198/"

