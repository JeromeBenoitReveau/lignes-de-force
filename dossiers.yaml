      - who: sharif
        role: Premier ministre du Pakistan
        text: >-
          Principal médiateur entre Washington et Téhéran : c'est lui qui a annoncé l'accord de juin 2026.
        sources:
          - "Al Jazeera (juin 2026) — https://www.aljazeera.com/news/2026/6/15/how-pakistan-mediated-a-us-iran-agreement-after-more-than-100-days-of-war"
      - who: munir
        role: Chef de l'armée pakistanaise
        text: >-
          A joué un rôle central dans la médiation : il « a veillé jour et nuit » pendant la négociation finale, selon
          Shehbaz Sharif.
        sources:
          - "Al Jazeera (juin 2026) — https://www.aljazeera.com/news/2026/6/15/how-pakistan-mediated-a-us-iran-agreement-after-more-than-100-days-of-war"

  - id: gaza
    title: La guerre à Gaza
    card: "1 200 morts en Israël le 7 octobre 2023, plus de 70 000 à Gaza depuis ; un cessez-le-feu tient depuis octobre 2025."
    since: "2023-10"
    verified: 2026-09

    # Carte d'ouverture. Coordonnées des lieux : Wikidata (P625).
    map:
      bounds: [[30.7, 33.4], [32.6, 35.8]]
      anchors: [[32.08, 34.78], [31.508, 34.46]]   # Tel Aviv, Gaza
      countries: [[IL], []]   # le Hamas tient Gaza, pas la Cisjordanie : la Palestine n'est pas colorée, Gaza est épinglée
      pins:
        - {label: Gaza, at: [31.508, 34.46], text: "La principale ville d'un territoire de 2 millions d'habitants, gouverné par le Hamas depuis 2007.",
           source: "Council on Foreign Relations, Global Conflict Tracker : le conflit israélo-palestinien (août 2026) — https://www.cfr.org/global-conflict-tracker/conflict/israeli-palestinian-conflict"}
        - {label: Rafah, at: [31.289, 34.252], text: "Au sud, à la frontière égyptienne : le plan de reconstruction de septembre 2026 doit commencer par Rafah.",
           source: "FDD's Long War Journal, le Board of Peace présente un plan de reconstruction de Gaza (sept. 2026) — https://www.longwarjournal.org/archives/2026/09/board-of-peace-unveils-gaza-recovery-plan-israel-reports-18-ceasefire-violations-sept-15-29.php", dir: left}
    lede: >-
      Le 7 octobre 2023, le Hamas attaque Israël : plus de 1 200 personnes sont tuées et 251 prises en otage. Israël
      répond par une guerre à Gaza qui a fait plus de 70 000 morts selon le ministère de la Santé de Gaza, contrôlé par le
      Hamas. Un cessez-le-feu tient en grande partie depuis octobre 2025, mais le désarmement du Hamas et le retrait
      israélien restent bloqués.
    lede_sources:
      - "Council on Foreign Relations, Global Conflict Tracker : le conflit israélo-palestinien (août 2026) — https://www.cfr.org/global-conflict-tracker/conflict/israeli-palestinian-conflict"
      - "Chatham House, Julie Norman : en acceptant de désarmer, le Hamas met Israël au pied du mur (août 2026) — https://www.chathamhouse.org/2026/08/agreeing-disarm-hamas-trying-call-israels-bluff-gaza"

    origins:
      text: >-
        Le Hamas, mouvement islamiste fondé en 1987, remporte les élections palestiniennes de 2006 puis chasse son rival,
        le Fatah, de Gaza en 2007. L'Égypte et Israël ferment alors leurs frontières avec ce territoire de 2 millions
        d'habitants. Plusieurs guerres suivent, jusqu'à l'attaque du 7 octobre 2023 et l'offensive israélienne qui y répond.
      sources:
        - "Council on Foreign Relations, « What Is Hamas? » (oct. 2025) — https://www.cfr.org/backgrounders/what-hamas"
        - "Council on Foreign Relations, Global Conflict Tracker : le conflit israélo-palestinien (août 2026) — https://www.cfr.org/global-conflict-tracker/conflict/israeli-palestinian-conflict"

    sides:
      - name: Israël
        actors: [IL]
        text: >-
          Dirigé par le Premier ministre Benyamin Netanyahou. Son armée contrôle près de 70 % de Gaza, contre 53 % au
          moment du cessez-le-feu, et Israël exige le désarmement complet du Hamas avant tout retrait, selon Chatham House.
        sources:
          - "Chatham House, Julie Norman (août 2026) — https://www.chathamhouse.org/2026/08/agreeing-disarm-hamas-trying-call-israels-bluff-gaza"
      - name: Le Hamas et le Jihad islamique
        actors: [hamas, pij]
        text: >-
          Le Hamas gouverne Gaza depuis 2007. Fin juillet 2026, il a accepté un plan de désarmement par étapes, à condition
          qu'Israël se retire au même rythme. Il est dirigé par Khalil al-Hayya.
        sources:
          - "Council on Foreign Relations, Global Conflict Tracker : le conflit israélo-palestinien (août 2026) — https://www.cfr.org/global-conflict-tracker/conflict/israeli-palestinian-conflict"
          - "Al Jazeera, le Board of Peace annonce un accord de désarmement du Hamas (juill. 2026) — https://www.aljazeera.com/news/2026/7/31/gaza-board-of-peace-announces-hamas-disarmament-agreement-what-we-know"
          - "Chatham House, Julie Norman (août 2026) — https://www.chathamhouse.org/2026/08/agreeing-disarm-hamas-trying-call-israels-bluff-gaza"

    stakes:
      - label: Désarmer d'abord, ou se retirer d'abord ?
        icon: gem
        text: >-
          Israël veut que le Hamas désarme avant tout retrait ; le Hamas conditionne chaque étape au retrait israélien.
          Cet ordre des étapes bloque l'application du plan de paix.
        sources:
          - "Chatham House, Julie Norman (août 2026) — https://www.chathamhouse.org/2026/08/agreeing-disarm-hamas-trying-call-israels-bluff-gaza"
          - "FDD's Long War Journal (sept. 2026) — https://www.longwarjournal.org/archives/2026/09/board-of-peace-unveils-gaza-recovery-plan-israel-reports-18-ceasefire-violations-sept-15-29.php"
      - label: Qui gouvernera Gaza ?
        icon: anchor
        text: >-
          Un comité palestinien doit administrer le territoire sans le Hamas, sous la supervision du Board of Peace, présidé
          par Donald Trump. Une force internationale doit être déployée jusqu'en 2027.
        sources:
          - "Al Jazeera (juill. 2026) — https://www.aljazeera.com/news/2026/7/31/gaza-board-of-peace-announces-hamas-disarmament-agreement-what-we-know"
          - "Council on Foreign Relations, Global Conflict Tracker : le conflit israélo-palestinien (août 2026) — https://www.cfr.org/global-conflict-tracker/conflict/israeli-palestinian-conflict"
      - label: La reconstruction
        icon: route
        text: >-
          En septembre 2026, le Board of Peace a présenté un plan de 2,45 milliards de dollars sur six mois. Il dépend du
          désarmement du Hamas et du retrait israélien.
        sources:
          - "FDD's Long War Journal (sept. 2026) — https://www.longwarjournal.org/archives/2026/09/board-of-peace-unveils-gaza-recovery-plan-israel-reports-18-ceasefire-violations-sept-15-29.php"
      - label: La survie des habitants
        icon: wheat
        text: >-
          Deux millions de personnes restent piégées dans le territoire. Selon l'ONU, environ deux tiers de Gaza restent
          inaccessibles à l'aide, ou très difficiles d'accès.
        sources:
          - "Conseil de sécurité de l'ONU, séance du 26 août 2026 (SC/16440) — https://press.un.org/en/2026/sc16440.doc.htm"

    toll:
      text: >-
        Selon le ministère de la Santé de Gaza, contrôlé par le Hamas, plus de 70 000 Palestiniens ont été tués depuis
        octobre 2023, dont au moins 1 100 depuis le cessez-le-feu d'octobre 2025. L'attaque du 7 octobre a tué plus de 1 200
        personnes en Israël. En août 2025, 1,9 million de Gazaouis, soit 90 % de la population, avaient été déplacés.
      sources:
        - "Council on Foreign Relations, Global Conflict Tracker : le conflit israélo-palestinien (août 2026) — https://www.cfr.org/global-conflict-tracker/conflict/israeli-palestinian-conflict"
        - "Al Jazeera (juill. 2026) — https://www.aljazeera.com/news/2026/7/31/gaza-board-of-peace-announces-hamas-disarmament-agreement-what-we-know"

    now:
      text: >-
        Le cessez-le-feu d'octobre 2025 tient en grande partie, mais les frappes continuent : Israël a mené 18 opérations
        contre des responsables du Hamas entre le 15 et le 29 septembre 2026. Le plan de reconstruction reste suspendu au
        désarmement et au retrait, et les négociations sont difficiles avant les élections israéliennes du 27 octobre.
      sources:
        - "FDD's Long War Journal (sept. 2026) — https://www.longwarjournal.org/archives/2026/09/board-of-peace-unveils-gaza-recovery-plan-israel-reports-18-ceasefire-violations-sept-15-29.php"
        - "Council on Foreign Relations, Global Conflict Tracker : le conflit israélo-palestinien (août 2026) — https://www.cfr.org/global-conflict-tracker/conflict/israeli-palestinian-conflict"

    # Au Conseil de sécurité de l'ONU : vetos et résolutions adoptées sur ce conflit
    council:
      - date: "2025-06"
        text: "Veto des États-Unis contre un texte demandant un cessez-le-feu immédiat et permanent ; 14 voix pour sur 15"
        source: "Security Council Report, le Conseil de sécurité en 2025 et l'année à venir (janv. 2026) — https://www.securitycouncilreport.org/monthly-forecast/2026-01/in-hindsight-the-security-council-in-2025-and-the-year-ahead.php"
      - date: "2025-09"
        text: "Second veto des États-Unis contre un texte semblable ; 14 voix pour sur 15"
        source: "Security Council Report, le Conseil de sécurité en 2025 et l'année à venir (janv. 2026) — https://www.securitycouncilreport.org/monthly-forecast/2026-01/in-hindsight-the-security-council-in-2025-and-the-year-ahead.php"
      - date: "2025-11"
        text: "Résolution 2803 adoptée : elle approuve le plan de paix et crée le Board of Peace ; la Chine et la Russie s'abstiennent"
        source: "Security Council Report, le Conseil de sécurité en 2025 et l'année à venir (janv. 2026) — https://www.securitycouncilreport.org/monthly-forecast/2026-01/in-hindsight-the-security-council-in-2025-and-the-year-ahead.php"

    timeline:
      - date: "2007"
        text: Le Hamas prend le contrôle de Gaza ; Israël et l'Égypte imposent un blocus
        source: "Council on Foreign Relations, Global Conflict Tracker : le conflit israélo-palestinien (août 2026) — https://www.cfr.org/global-conflict-tracker/conflict/israeli-palestinian-conflict"
      - date: "2023-10"
        text: Attaque du Hamas contre Israël ; début de la guerre à Gaza
        source: "Council on Foreign Relations, Global Conflict Tracker : le conflit israélo-palestinien (août 2026) — https://www.cfr.org/global-conflict-tracker/conflict/israeli-palestinian-conflict"
      - date: "2025-08"
        text: 90 % des Gazaouis déplacés ; l'ONU alerte sur un risque de famine
        source: "Council on Foreign Relations, Global Conflict Tracker : le conflit israélo-palestinien (août 2026) — https://www.cfr.org/global-conflict-tracker/conflict/israeli-palestinian-conflict"
      - date: "2025-10"
        text: Cessez-le-feu et libération des otages (plan de Donald Trump)
        source: "Council on Foreign Relations, Global Conflict Tracker : le conflit israélo-palestinien (août 2026) — https://www.cfr.org/global-conflict-tracker/conflict/israeli-palestinian-conflict"
      - date: "2026-07"
        text: Le Hamas accepte un plan de désarmement par étapes
        source: "Al Jazeera (juill. 2026) — https://www.aljazeera.com/news/2026/7/31/gaza-board-of-peace-announces-hamas-disarmament-agreement-what-we-know"
      - date: "2026-09"
        text: Plan de reconstruction de 2,45 milliards de dollars du Board of Peace
        source: "FDD's Long War Journal (sept. 2026) — https://www.longwarjournal.org/archives/2026/09/board-of-peace-unveils-gaza-recovery-plan-israel-reports-18-ceasefire-violations-sept-15-29.php"

  - id: sahel
    title: La guerre au Sahel
    card: "Depuis 2012, jihadistes et séparatistes défient les armées du Mali et du Burkina Faso ; Bamako vit sous blocus."
    since: "2012"
    verified: 2026-10

    # Carte d'ouverture. Coordonnées des lieux : Wikidata (P625). Pas de zones de contrôle : aucune source fiable région par région.
    # Dioura (attaque de septembre 2026) n'est pas épinglée : coordonnées non vérifiées.
    map:
      bounds: [[9.5, -12.5], [25.0, 5.0]]
      anchors: [[12.646, -7.992], [18.441, 1.408]]   # Bamako, Kidal
      countries: [[ML, BF], []]   # les groupes armés n'administrent pas un pays : Kidal est épinglée
      pins:
        - {label: Bamako, at: [12.646, -7.992], text: "La capitale du Mali. Depuis septembre 2025, le JNIM attaque les camions-citernes qui l'approvisionnent depuis le Sénégal et la Côte d'Ivoire.",
           source: "Al Jazeera, le Mali fête son indépendance en pleine crise sécuritaire (sept. 2026) — https://www.aljazeera.com/news/2026/9/22/mali-marks-independence-amid-a-worsening-security-crisis", dir: left}
        - {label: Kati, at: [12.747, -8.071], text: "Ville de garnison aux portes de Bamako. Le ministre de la Défense, Sadio Camara, y est tué dans un attentat le 25 avril 2026.",
           source: "Security Council Report, Afrique de l'Ouest et Sahel, prévisions de juillet 2026 — https://www.securitycouncilreport.org/monthly-forecast/2026-07/west-africa-and-the-sahel-17.php"}
        - {label: Sévaré, at: [14.533, -4.1], text: "Dans le centre du Mali, visée lors de l'offensive coordonnée du 25 avril 2026.",
           source: "Security Council Report, Afrique de l'Ouest et Sahel, prévisions de juillet 2026 — https://www.securitycouncilreport.org/monthly-forecast/2026-07/west-africa-and-the-sahel-17.php"}
        - {label: Gao, at: [16.267, -0.05], text: "Grande ville du Nord, visée lors de l'offensive coordonnée du 25 avril 2026.",
           source: "Security Council Report, Afrique de l'Ouest et Sahel, prévisions de juillet 2026 — https://www.securitycouncilreport.org/monthly-forecast/2026-07/west-africa-and-the-sahel-17.php"}
        - {label: Kidal, at: [18.441, 1.408], text: "Bastion des rebelles touaregs. Fin avril 2026, les militaires russes s'en retirent après un accord avec le FLA, qui en revendique le contrôle.",
           source: "Security Council Report, Afrique de l'Ouest et Sahel, prévisions de juillet 2026 — https://www.securitycouncilreport.org/monthly-forecast/2026-07/west-africa-and-the-sahel-17.php"}
    lede: >-
      Depuis 2012, le Mali puis le Burkina Faso affrontent des groupes jihadistes et des rebelles séparatistes. Les
      militaires qui ont pris le pouvoir ont renvoyé l'armée française et fait venir des combattants russes. Le 25 avril
      2026, une offensive coordonnée du JNIM et du FLA frappe Bamako et le Nord, tue le ministre malien de la Défense et
      fait tomber Kidal. La capitale vit depuis sous un blocus du carburant.
    lede_sources:
      - "Security Council Report, Afrique de l'Ouest et Sahel, prévisions de juillet 2026 — https://www.securitycouncilreport.org/monthly-forecast/2026-07/west-africa-and-the-sahel-17.php"
      - "Al Jazeera, le Mali fête son indépendance en pleine crise sécuritaire (sept. 2026) — https://www.aljazeera.com/news/2026/9/22/mali-marks-independence-amid-a-worsening-security-crisis"

    origins:
      text: >-
        En 2012, un coup d'État renverse le président malien. Des rebelles touaregs s'emparent de Gao, Kidal et Tombouctou
        et proclament un État indépendant, l'Azawad, avant d'être débordés par des groupes liés à Al-Qaïda. La France
        intervient en 2013 à la demande du Mali, puis installe une force régionale de plusieurs milliers de soldats, aux
        côtés de 15 000 Casques bleus. La violence gagne pourtant le Burkina Faso et le Niger. Des militaires prennent le
        pouvoir au Mali (2020 et 2021), au Burkina Faso (2022) et au Niger (2023), obtiennent le départ des troupes
        françaises et de la mission de l'ONU, et se tournent vers la Russie.
      sources:
        - "Council on Foreign Relations, Global Conflict Tracker : l'extrémisme violent au Sahel (juill. 2026) — https://www.cfr.org/global-conflict-tracker/conflict/violent-extremism-sahel"

    sides:
      - name: Les juntes du Sahel
        actors: [ML, BF]
        text: >-
          Le Mali est dirigé par Assimi Goïta, arrivé au pouvoir par le coup d'État de 2020, et le Burkina Faso par le
          capitaine Ibrahim Traoré depuis 2022. Avec le Niger, ils ont signé un pacte de défense mutuelle en 2023 et
          quitté la CEDEAO, l'organisation des pays d'Afrique de l'Ouest, en janvier 2025. Après l'offensive
          d'avril 2026, les trois pays auraient mené des frappes aériennes coordonnées au Mali, selon le Security
          Council Report.
        sources:
          - "Council on Foreign Relations, Global Conflict Tracker : l'extrémisme violent au Sahel (juill. 2026) — https://www.cfr.org/global-conflict-tracker/conflict/violent-extremism-sahel"
          - "Security Council Report, Afrique de l'Ouest et Sahel, prévisions de juillet 2026 — https://www.securitycouncilreport.org/monthly-forecast/2026-07/west-africa-and-the-sahel-17.php"
          - "Al Jazeera, le Mali fête son indépendance en pleine crise sécuritaire (sept. 2026) — https://www.aljazeera.com/news/2026/9/22/mali-marks-independence-amid-a-worsening-security-crisis"
      - name: Les groupes armés
        actors: [jnim, fla]
        text: >-
          Ce ne sont pas des alliés naturels. Le JNIM, branche d'Al-Qaïda née en 2017, veut imposer la loi islamique ; le
          FLA, coalition de groupes touaregs et arabes, veut l'indépendance du nord du Mali. Ils coordonnent leurs
          attaques depuis avril 2026, comme en 2012 et en 2024, mais ces alliances se sont déjà rompues sur des désaccords
          de territoire et de doctrine. Un troisième groupe, l'État islamique au Sahel, combat à la fois les armées et le
          JNIM.
        sources:
          - "Council on Foreign Relations, Global Conflict Tracker : l'extrémisme violent au Sahel (juill. 2026) — https://www.cfr.org/global-conflict-tracker/conflict/violent-extremism-sahel"
          - "Al Jazeera, le Mali fête son indépendance en pleine crise sécuritaire (sept. 2026) — https://www.aljazeera.com/news/2026/9/22/mali-marks-independence-amid-a-worsening-security-crisis"

    stakes:
      - label: Le nord du Mali
        icon: anchor
        text: >-
          Le FLA réclame l'indépendance de l'Azawad. Fin avril 2026, les militaires russes quittent Kidal après un accord
          qui garantit leur départ sans combat ; le FLA en revendique le contrôle et exige leur retrait de tout le Mali.
        sources:
          - "Security Council Report, Afrique de l'Ouest et Sahel, prévisions de juillet 2026 — https://www.securitycouncilreport.org/monthly-forecast/2026-07/west-africa-and-the-sahel-17.php"
      - label: Les routes du carburant
        icon: route
        text: >-
          Bamako dépend des camions-citernes venus du Sénégal et de la Côte d'Ivoire. En les attaquant depuis septembre
          2025, le JNIM provoque des pénuries, des coupures d'électricité et des fermetures d'écoles. Le 14 septembre
          2026, plus de 900 camions sont entrés dans la capitale sous escorte militaire, selon le gouvernement malien.
        sources:
          - "Al Jazeera, le Mali fête son indépendance en pleine crise sécuritaire (sept. 2026) — https://www.aljazeera.com/news/2026/9/22/mali-marks-independence-amid-a-worsening-security-crisis"
      - label: La présence russe
        icon: gem
        text: >-
          Entre 1 000 et 2 000 combattants russes sont au Mali, selon les sources ; l'Africa Corps, qui dépend du ministère russe de la Défense, a
          remplacé le groupe Wagner en 2025. L'offensive d'avril 2026 l'a contraint à quitter le Nord pour se regrouper
          autour de Bamako, ce qui montre ses limites selon le Soufan Center.
        sources:
          - "Carnegie Endowment, « Russia in Africa: Examining Moscow's Influence and Its Limits » (févr. 2026) — https://carnegieendowment.org/research/2026/02/russia-role-west-southern-africa-junta-wagner-africa-corps"
          - "Al Jazeera, le rôle de la Russie dans la sécurité du Mali et du Sahel (avr. 2026) — https://www.aljazeera.com/news/2026/4/29/what-role-has-russia-played-in-malis-security-and-the-sahel-region"
          - "Soufan Center, les limites de l'Africa Corps : le Mali et l'offensive JNIM-FLA (mai 2026) — https://thesoufancenter.org/intelbrief-2026-may-12/"
      - label: La rupture avec les voisins
        icon: wheat
        text: >-
          Le Mali, le Burkina Faso et le Niger ont quitté la CEDEAO et formé leur propre alliance, l'Alliance des États du
          Sahel. Ils se retirent aussi de la Cour pénale internationale. Le Mali présente ces départs comme une
          affirmation de sa souveraineté.
        sources:
          - "Al Jazeera, le Mali fête son indépendance en pleine crise sécuritaire (sept. 2026) — https://www.aljazeera.com/news/2026/9/22/mali-marks-independence-amid-a-worsening-security-crisis"
          - "Council on Foreign Relations, Global Conflict Tracker : l'extrémisme violent au Sahel (juill. 2026) — https://www.cfr.org/global-conflict-tracker/conflict/violent-extremism-sahel"

    toll:
      text: >-
        Au Mali, plus de 400 000 personnes étaient déplacées dans leur propre pays en juin 2026, selon le HCR. Au Burkina
        Faso, plus de deux millions de personnes, près d'un habitant sur dix, ont dû fuir, et 800 000 vivent dans des
        villes assiégées par des groupes armés qui contrôlent environ 40 % du territoire, selon ACAPS. Les violences
        impliquant des groupes jihadistes dans la région sont passées de 63 en 2016 à 2 845 en 2025, d'après les relevés
        d'ACLED cités par le Council on Foreign Relations.
      sources:
        - "Al Jazeera, le Mali fête son indépendance en pleine crise sécuritaire (sept. 2026) — https://www.aljazeera.com/news/2026/9/22/mali-marks-independence-amid-a-worsening-security-crisis"
        - "ACAPS, fiche pays Burkina Faso (mise à jour de juin 2026) — https://www.acaps.org/en/countries/burkina-faso"
        - "Council on Foreign Relations, Global Conflict Tracker : l'extrémisme violent au Sahel (juill. 2026) — https://www.cfr.org/global-conflict-tracker/conflict/violent-extremism-sahel"

    now:
      text: >-
        La guerre continue sans négociation. Le 10 septembre 2026, le JNIM attaque le camp militaire de Dioura, dans le
        centre du Mali. Le blocus de Bamako se poursuit, et le carburant n'arrive que par convois escortés. Une analyste
        citée par Al Jazeera craint que le durcissement de la junte comme des groupes armés n'empêche tout nouvel accord
        de paix.
      sources:
        - "Al Jazeera, le Mali fête son indépendance en pleine crise sécuritaire (sept. 2026) — https://www.aljazeera.com/news/2026/9/22/mali-marks-independence-amid-a-worsening-security-crisis"

    timeline:
      - date: "2012"
        text: Coup d'État au Mali ; des rebelles touaregs proclament l'indépendance de l'Azawad
        source: "Council on Foreign Relations, Global Conflict Tracker : l'extrémisme violent au Sahel (juill. 2026) — https://www.cfr.org/global-conflict-tracker/conflict/violent-extremism-sahel"
      - date: "2013"
